<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Dr. Ankita Goklani's Elite Dental Care | Chhatrapati Sambhajinagar</title>
    <meta name="description" content="Dr. Ankita Goklani's Elite Dental Care (दातांचा दवाखाना) - Premier dental clinic in Jawahar Colony, Chhatrapati Sambhajinagar. Book appointment online." />
    
    <!-- PWA Primary Color & Meta Tags -->
    <meta name="theme-color" content="#0d9488" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Elite Dental" />

    <!-- Favicon and PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/icon-192.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Performance preconnects -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  </head>
  <body class="bg-slate-900 text-slate-900 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Register PWA Service Worker for Instant Speed & Offline Support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('ServiceWorker registered:', reg.scope))
            .catch((err) => console.log('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
