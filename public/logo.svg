<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="100%" height="100%">
  <defs>
    <!-- Blue Gradient for 'A' -->
    <linearGradient id="blueA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b49"/>
      <stop offset="35%" stop-color="#006699"/>
      <stop offset="70%" stop-color="#00a8e8"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>

    <!-- Lime Green Gradient for Left Figure -->
    <linearGradient id="greenFig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>

    <!-- Pink Gradient for Right Figure -->
    <linearGradient id="pinkFig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>

    <!-- Teal Gradient for Inner Tooth Line -->
    <linearGradient id="tealInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Text 'Dr.' at top left -->
    <text x="110" y="115" font-family="'Times New Roman', Georgia, serif" font-weight="900" font-size="64" fill="#1e293b" letter-spacing="-1">Dr.</text>

    <!-- Capital Letter 'A' -->
    <!-- Apex -->
    <path d="M 270 40 L 210 160 L 255 160 L 285 95 L 350 250 L 320 250 L 370 380 L 440 380 L 405 380 L 270 40 Z" fill="url(#blueA)" />
    <!-- Complete A shape background geometry -->
    <path d="M 265 42 L 120 380 L 205 380 L 245 280 L 345 280 L 385 380 L 450 380 Z" fill="url(#blueA)" />
    <!-- Inner triangular cutout of A -->
    <polygon points="295,110 235,240 355,240" fill="#ffffff" />
  </g>

  <!-- Central Tooth & Figures Group (Front layer) -->
  <g filter="url(#dropShadow)">
    <!-- White Tooth Core Background -->
    <path d="M 170 170 C 190 135, 310 135, 330 170 C 350 210, 340 270, 315 320 C 295 360, 275 390, 250 395 C 225 390, 205 360, 185 320 C 160 270, 150 210, 170 170 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />

    <!-- Left Green Figure (Head & Body) -->
    <!-- Head -->
    <circle cx="155" cy="155" r="16" fill="url(#greenFig)" />
    <!-- Body & Left Tooth Wing -->
    <path d="M 152 178 C 120 185, 115 220, 140 260 C 160 295, 175 340, 205 385 C 195 350, 175 300, 160 260 C 145 225, 155 195, 230 205 C 190 190, 165 185, 152 178 Z" fill="url(#greenFig)" />

    <!-- Right Pink Figure (Head, Body & Reaching Arm) -->
    <!-- Head -->
    <circle cx="295" cy="165" r="16" fill="url(#pinkFig)" />
    <!-- Arm extending to the right leg of A -->
    <path d="M 305 180 C 330 185, 360 180, 385 200 C 360 210, 330 200, 305 195 Z" fill="url(#pinkFig)" />
    <!-- Body & Right Tooth Wing -->
    <path d="M 290 185 C 330 195, 340 240, 325 285 C 310 325, 285 365, 260 395 C 275 350, 300 310, 310 270 C 320 230, 300 200, 240 210 C 270 195, 285 190, 290 185 Z" fill="url(#pinkFig)" />

    <!-- Inner Turquoise / Teal Tooth Contour Line -->
    <path d="M 180 230 C 170 270, 185 310, 215 350 C 205 320, 195 285, 205 250 C 215 215, 245 225, 270 245 C 240 220, 200 205, 180 230 Z" fill="url(#tealInner)" />
  </g>
</svg>
